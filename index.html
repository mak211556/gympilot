<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>GymPilot | Your Fitness System</title>



<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">


<script src="https://cdn.tailwindcss.com"></script>



<style>


*{
box-sizing:border-box;
}



body{

margin:0;

min-height:100vh;

background:

radial-gradient(circle at top left,
rgba(34,197,94,.25),
transparent 35%),

radial-gradient(circle at bottom right,
rgba(59,130,246,.25),
transparent 35%),

#030712;


color:white;

font-family:'Manrope',sans-serif;

}



h1,h2,h3{

font-family:'Sora',sans-serif;

}



.container{

max-width:900px;

margin:auto;

padding:35px 20px;

}




.glass{

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.12);

backdrop-filter:

blur(25px);

border-radius:30px;

}





.logo{

background:

linear-gradient(
90deg,
#22c55e,
#38bdf8
);


-webkit-background-clip:text;

color:transparent;

}





.option{


background:

rgba(17,24,39,.85);


border:

1px solid rgba(255,255,255,.12);


border-radius:22px;


padding:20px;


cursor:pointer;


transition:.25s;


}



.option:hover{


transform:translateY(-3px);


border-color:#22c55e;


}



.option.selected{


border:

2px solid #22c55e;


background:

rgba(34,197,94,.15);


}




.input{


width:100%;


padding:15px;


border-radius:15px;


background:#111827;


border:

1px solid #374151;


color:white;


margin-top:8px;


}




.input:focus{


outline:none;


border-color:#22c55e;


}




.primary{


width:100%;


padding:16px;


border-radius:18px;


background:

linear-gradient(
90deg,
#22c55e,
#3b82f6
);


font-weight:800;


transition:.3s;


}




.primary:hover{


transform:scale(1.03);


}




.progress-bg{


height:10px;


background:#1f2937;


border-radius:20px;


overflow:hidden;


}



.progress{


height:100%;


width:0%;


background:

linear-gradient(
90deg,
#22c55e,
#38bdf8
);


transition:.4s;


}





.fade{


animation:fade .35s ease;


}



@keyframes fade{


from{

opacity:0;

transform:translateY(15px);

}


to{

opacity:1;

transform:translateY(0);

}


}




</style>


</head>




<body>



<div class="container">






<!-- HEADER -->

<div class="text-center mb-10">


<h1 class="text-6xl font-black logo">

GymPilot

</h1>


<p class="text-xl text-gray-300 mt-4">

Your personalised fitness system

</p>


<p class="text-gray-400 mt-2">

Let's build your perfect training experience.

</p>


</div>








<!-- PROGRESS -->

<div class="glass p-6 mb-8">


<div class="flex justify-between mb-3">


<span>

Profile Progress

</span>



<span id="progressText">

0%

</span>


</div>




<div class="progress-bg">


<div id="progress"

class="progress">

</div>


</div>



</div>








<!-- APP WINDOW -->


<div id="app"

class="glass p-8 fade">


</div>









<!-- NAVIGATION -->


<div class="grid grid-cols-2 gap-4 mt-6">


<button

id="back"

class="primary hidden"

onclick="back()">

← Back

</button>




<button

id="next"

class="primary"

onclick="next()">

Start →

</button>



</div>







</div><script>


const questions = [


{
title:"Welcome to GymPilot 🚀",
type:"info",
content:`

<h2 class="text-4xl font-bold mb-5">
Your fitness journey starts here
</h2>

<p class="text-gray-300 text-lg">
GymPilot learns about you, your goals and your lifestyle to create a personalised training experience.
</p>


<div class="grid md:grid-cols-3 gap-4 mt-8">

<div class="option">
💪
<h3 class="font-bold mt-2">Training</h3>
<p class="text-gray-400">Personal workouts</p>
</div>


<div class="option">
📈
<h3 class="font-bold mt-2">Progress</h3>
<p class="text-gray-400">Track improvement</p>
</div>


<div class="option">
🔥
<h3 class="font-bold mt-2">Guidance</h3>
<p class="text-gray-400">Built around you</p>
</div>

</div>

`

},




{
title:"Personal Details",
type:"form",
content:`

<h2 class="text-3xl font-bold mb-5">
👤 About You
</h2>


<input id="name" class="input" placeholder="Name">


<input id="age" class="input" placeholder="Age" type="number">


<input id="height" class="input" placeholder="Height (cm)" type="number">


<input id="weight" class="input" placeholder="Weight (kg)" type="number">


<input id="target" class="input" placeholder="Target weight (kg)" type="number">

`

},






{
title:"Fitness Level",
type:"single",
key:"fitness",
options:[

"🌱 Beginner",

"⚡ Intermediate",

"🔥 Advanced",

"🏆 Athlete"

]

},






{
title:"Your Goals",
type:"multi",
key:"goals",
options:[

"💪 Build Muscle",

"🔥 Lose Fat",

"🏋️ Get Stronger",

"🏃 Improve Fitness",

"🤸 Improve Mobility",

"⚡ Sports Performance"

]

},







{
title:"Training Style",
type:"single",
key:"style",
options:[

"💪 Bodybuilding",

"🏋️ Strength",

"⚡ Athletic",

"⚖️ Balanced"

]

},







{
title:"Gym Setup",
type:"single",
key:"gym",
options:[

"🏢 Commercial Gym",

"🏠 Home Gym",

"💪 Dumbbells Only",

"🤸 Bodyweight"

]

},







{
title:"Equipment",
type:"multi",
key:"equipment",
options:[

"🏋️ Barbell",

"💪 Dumbbells",

"⚙️ Machines",

"🔗 Cable Machine",

"🦵 Squat Rack",

"🔥 Leg Press",

"🏃 Cardio Equipment",

"🟢 Resistance Bands"

]

},







{
title:"Training Schedule",
type:"form",
content:`

<h2 class="text-3xl font-bold mb-5">
📅 Your Schedule
</h2>


<select id="days" class="input">

<option>2 Days per week</option>
<option>3 Days per week</option>
<option>4 Days per week</option>
<option>5 Days per week</option>
<option>6+ Days per week</option>

</select>



<select id="time" class="input">

<option>30 Minutes</option>
<option>45 Minutes</option>
<option>60 Minutes</option>
<option>90+ Minutes</option>

</select>

`

},







{
title:"Warm Up & Mobility",
type:"single",
key:"mobility",
options:[

"⚡ Quick Warm Up",

"🔥 Full Warm Up",

"🤸 Mobility Focus",

"🏆 Performance"

]

},







{
title:"Lifestyle",
type:"form",
content:`

<h2 class="text-3xl font-bold mb-5">
🌙 Lifestyle
</h2>


<select id="sleep" class="input">

<option>Less than 5 hours sleep</option>
<option>5-7 hours sleep</option>
<option>7-9 hours sleep</option>
<option>9+ hours sleep</option>

</select>


<select id="activity" class="input">

<option>Low activity</option>
<option>Average activity</option>
<option>High activity</option>

</select>

`

},







{
title:"Nutrition",
type:"single",
key:"food",
options:[

"🍽️ No Tracking",

"🥩 High Protein",

"📊 Calorie Tracking",

"🥗 Healthy Eating"

]

},






{
title:"Motivation",
type:"single",
key:"motivation",
options:[

"⭐ Confidence",

"❤️ Health",

"⚡ Discipline",

"🏆 Performance"

]

},






{
title:"Complete 🎉",
type:"finish",
content:`

<h2 class="text-4xl font-bold">
Your GymPilot profile is ready
</h2>


<p class="text-gray-300 mt-4">
Creating your personalised dashboard...
</p>

`

}



];





let current = 0;


let profile = {

goals:[],

equipment:[]

};







function display(){



let q = questions[current];


let html = `

<div class="fade">


<h2 class="text-3xl font-bold mb-6">

${q.title}

</h2>

`;





if(q.content){

html += q.content;

}







if(q.type==="single" || q.type==="multi"){



html+=`

<div class="grid md:grid-cols-2 gap-5">

`;



q.options.forEach(option=>{


html+=`

<div class="option"

onclick="choose(this,'${q.key}','${option}','${q.type}')">

${option}

</div>

`;


});



html+=`</div>`;



}



html+=`</div>`;


document.getElementById("app").innerHTML=html;



document.getElementById("back").classList.toggle(

"hidden",

current===0

);



document.getElementById("next").innerHTML=

current===questions.length-1

?

"Create Profile 🚀"

:

"Continue →";



progress();



}









function choose(el,key,value,type){



if(type==="single"){


el.parentElement

.querySelectorAll(".option")

.forEach(x=>x.classList.remove("selected"));



el.classList.add("selected");


profile[key]=value;


}



if(type==="multi"){


el.classList.toggle("selected");



if(!profile[key]) profile[key]=[];



if(el.classList.contains("selected")){


profile[key].push(value);


}

else{


profile[key]=profile[key].filter(x=>x!==value);


}



}



}









function save(){



[
"name",
"age",
"height",
"weight",
"target"

].forEach(id=>{


let x=document.getElementById(id);


if(x){

profile[id]=x.value;

}


});




[
"days",
"time",
"sleep",
"activity"

].forEach(id=>{


let x=document.getElementById(id);


if(x){

profile[id]=x.value;

}


});



}









function next(){


save();



if(current===questions.length-1){


finish();


return;


}



current++;


display();


}






function back(){



if(current>0){

current--;

display();

}


}







function progress(){



let percent=Math.round(

(current/(questions.length-1))*100

);



document.getElementById("progress").style.width=

percent+"%";



document.getElementById("progressText").innerHTML=

percent+"%";



}








function finish(){



save();



if(

!profile.name ||

!profile.age ||

!profile.height ||

!profile.weight ||

profile.goals.length===0

){


alert("Please complete your main profile information first.");


return;


}



localStorage.setItem(

"gympilot",

JSON.stringify(profile)

);



document.getElementById("app").innerHTML=`

<h2 class="text-4xl font-bold text-center">

Profile Created 🎉

</h2>

<p class="text-center text-gray-300 mt-4">

Welcome ${profile.name}

</p>

`;



setTimeout(()=>{

window.location.href="dashboard.html";

},2500);



}






display();



</script>


</body>

</html>
