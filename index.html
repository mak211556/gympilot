<!-- Fonts -->

<style>


*{
box-sizing:border-box;
}



body{


min-height:100vh;


margin:0;


background:

radial-gradient(
circle at top left,
rgba(34,197,94,0.25),
transparent 35%
),

radial-gradient(
circle at bottom right,
rgba(59,130,246,0.25),
transparent 35%
),

#030712;


color:white;


font-family:'Manrope',sans-serif;


}



h1,h2,h3{


font-family:'Sora',sans-serif;


}



.app-container{


max-width:900px;


margin:auto;


padding:35px 20px;


}




.glass{


background:

rgba(255,255,255,0.08);


border:

1px solid rgba(255,255,255,0.12);


backdrop-filter:

blur(25px);


border-radius:32px;


}




.logo{


background:

linear-gradient(
90deg,
#22c55e,
#38bdf8
);


-webkit-background-clip:text;


color:transparent;


}




.progress-background{


height:10px;


background:#1f2937;


border-radius:20px;


overflow:hidden;


}




.progress-fill{


height:100%;


width:0%;


background:

linear-gradient(
90deg,
#22c55e,
#38bdf8
);


transition:.5s;


}





.option{


background:

rgba(17,24,39,.8);


border:

1px solid rgba(255,255,255,.1);


border-radius:22px;


padding:20px;


cursor:pointer;


transition:.25s;


}





.option:hover{


transform:translateY(-4px);


border-color:#22c55e;


}





.option.active{


background:

rgba(34,197,94,.18);


border:

2px solid #22c55e;


}





.input{


width:100%;


background:#111827;


border:

1px solid #374151;


padding:15px;


border-radius:16px;


margin-top:8px;


color:white;


}




.input:focus{


outline:none;


border-color:#22c55e;


}





.main-button{


width:100%;


padding:17px;


border-radius:18px;


font-weight:800;


background:

linear-gradient(
90deg,
#22c55e,
#3b82f6
);


transition:.3s;


}




.main-button:hover{


transform:scale(1.03);


}





.fade{


animation:

fade .35s ease;


}



@keyframes fade{


from{

opacity:0;

transform:translateY(15px);

}


to{

opacity:1;

transform:translateY(0);

}


}



</style>


</head>






<body>




<div class="app-container">






<!-- HEADER -->


<div class="text-center mb-10">


<h1 class="text-6xl font-black logo">

GymPilot

</h1>



<p class="text-xl text-gray-300 mt-4">

Your personalised fitness journey

</p>



<p class="text-gray-400 mt-2">

Build your profile. Get your training system.

</p>



</div>









<!-- PROGRESS -->


<div class="glass p-6 mb-8">


<div class="flex justify-between mb-3">


<span class="text-gray-300">

Profile Progress

</span>



<span id="progressText">

0%

</span>



</div>




<div class="progress-background">


<div id="progressBar"

class="progress-fill">

</div>


</div>



</div>









<!-- QUESTION AREA -->


<div id="questionBox"

class="glass p-8 fade">


</div>









<!-- BUTTONS -->


<div class="grid grid-cols-2 gap-4 mt-6">


<button

id="backButton"

class="main-button hidden"

onclick="previousQuestion()">

← Back

</button>



<button

id="nextButton"

class="main-button"

onclick="nextQuestion()">

Start →

</button>


</div>








</div><!-- ========================= -->
<!-- GYMPILOT V3 PART 2/3 -->
<!-- ========================= -->

<script>



let currentQuestion = 0;



let answers = {


equipment:[],


goals:[]


};







function loadQuestion(){



let q = questions[currentQuestion];



let box = document.getElementById("questionBox");



let html = `

<div class="fade">

<h2 class="text-3xl font-bold mb-6">

${q.title}

</h2>

`;






if(q.type === "welcome" || q.type === "inputs" || q.type === "select" || q.type === "finish"){


html += q.content;


}







if(q.type === "single" || q.type === "multi"){



html += `

<div class="grid md:grid-cols-2 gap-5">

`;



q.options.forEach(option=>{


html += `


<div class="option"

onclick="selectOption(this,'${q.key}','${option}','${q.type}')">


${option}


</div>


`;



});



html += `

</div>

`;



}







html += `</div>`;



box.innerHTML = html;






document.getElementById("nextButton").innerHTML =

currentQuestion === questions.length-1

?

"Create Profile 🚀"

:

"Continue →";





document.getElementById("backButton").classList.toggle(

"hidden",

currentQuestion===0

);





updateProgress();



}









function selectOption(element,key,value,type){



if(type==="single"){



let options =

element.parentElement.querySelectorAll(".option");



options.forEach(option=>{


option.classList.remove("active");


});



element.classList.add("active");



answers[key]=value;



}







if(type==="multi"){



element.classList.toggle("active");



if(!answers[key]){


answers[key]=[];


}



if(element.classList.contains("active")){


if(!answers[key].includes(value)){


answers[key].push(value);


}


}

else{


answers[key] = answers[key].filter(

item=>item!==value

);


}



}



}









function saveInputs(){



let fields=[


"name",
"age",
"height",
"weight",
"targetWeight"


];



fields.forEach(field=>{



let input=document.getElementById(field);



if(input){


answers[field]=input.value;


}


});






let selects=[


"days",
"duration",
"sleep",
"activity"


];



selects.forEach(select=>{



let item=document.getElementById(select);



if(item){


answers[select]=item.value;


}



});



}









function nextQuestion(){



saveInputs();





if(currentQuestion === questions.length-1){



createProfile();



return;



}





currentQuestion++;



loadQuestion();



}









function previousQuestion(){



if(currentQuestion>0){



currentQuestion--;


loadQuestion();



}



}









function updateProgress(){



let percent = Math.round(


(currentQuestion /

(questions.length-1))

*

100


);



document.getElementById("progressBar").style.width =

percent+"%";



document.getElementById("progressText").innerHTML =

percent+"%";



}









function createProfile(){



saveInputs();






if(

!answers.name ||

!answers.age ||

!answers.height ||

!answers.weight ||

!answers.goals ||

answers.goals.length===0

){



alert(

"Please complete your profile before continuing."

);



return;


}







localStorage.setItem(

"gympilot",

JSON.stringify(answers)

);






document.getElementById("questionBox").innerHTML = `



<div class="text-center">


<h2 class="text-4xl font-bold mb-5">

Profile Created 🎉

</h2>



<p class="text-gray-300">

Welcome to GymPilot, ${answers.name}.

</p>


<p class="text-gray-400 mt-3">

Generating your personalised dashboard...

</p>


</div>


`;





setTimeout(()=>{


window.location.href="dashboard.html";


},2500);



}









// Start App


loadQuestion();



</script>
