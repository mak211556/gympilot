<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GymPilot</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
overflow:hidden;

background:#050505;

font-family:'Manrope',sans-serif;

color:white;

}



/* BACKGROUND */


.background{

position:fixed;

inset:0;

overflow:hidden;

}



.orb{

position:absolute;

border-radius:50%;

filter:blur(120px);

animation:breathe 8s infinite ease-in-out;

}



.orb1{

width:500px;
height:500px;

background:#8FE3D6;

opacity:.25;

top:-200px;
left:-150px;

}



.orb2{

width:400px;
height:400px;

background:#E8DDCC;

opacity:.15;

right:-150px;

bottom:-150px;

animation-delay:2s;

}





@keyframes breathe{

0%,100%{

transform:scale(1);

}


50%{

transform:scale(1.25);

}

}




/* APP */


.app{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:25px;

}



.container{

width:100%;

max-width:500px;

text-align:center;

animation:appear .7s ease;

}




@keyframes appear{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}






/* TEXT */


.logo{

font-size:64px;

font-weight:800;

letter-spacing:-4px;


background:linear-gradient(
90deg,
#E8DDCC,
#8FE3D6
);


-webkit-background-clip:text;

color:transparent;

}



.title{

font-size:38px;

font-weight:800;

line-height:1.15;

margin-top:25px;

}



.subtitle{

font-size:18px;

color:#999;

margin-top:20px;

line-height:1.5;

}






/* BUTTONS */


.primary{


margin-top:45px;

width:100%;

padding:20px;


border-radius:999px;


border:none;


background:#8FE3D6;


color:#050505;


font-size:18px;


font-weight:800;


cursor:pointer;


transition:.3s;


box-shadow:

0 0 40px rgba(143,227,214,.35);


}



.primary:hover{

transform:scale(1.05);

box-shadow:

0 0 70px rgba(143,227,214,.6);

}







/* PROGRESS */


.progress-container{

position:absolute;

top:25px;

left:25px;

right:25px;

height:7px;

background:#222;

border-radius:20px;

}



.progress{

height:100%;

width:0%;

background:#8FE3D6;

border-radius:20px;

transition:.5s;

}





/* CARDS */


.card{


margin-top:30px;


background:

rgba(255,255,255,.08);


border:

1px solid rgba(255,255,255,.12);



backdrop-filter:blur(25px);


padding:30px;


border-radius:35px;


}




.input{


width:100%;

padding:18px;


background:#111;


border:none;


border-radius:25px;


color:white;


font-size:17px;


margin-bottom:15px;


}





.option{


background:#111;


border-radius:28px;


padding:22px;


margin-top:15px;


cursor:pointer;


transition:.3s;


font-size:18px;


}



.option:hover{

transform:scale(1.03);

}



.option.active{


background:#8FE3D6;


color:#050505;


transform:scale(1.05);


}






.small{

color:#888;

font-size:14px;

margin-top:15px;

}





.hidden{

display:none;

}



</style>


</head>


<body>



<div class="background">

<div class="orb orb1"></div>

<div class="orb orb2"></div>

</div>




<div class="progress-container">

<div class="progress" id="progress"></div>

</div>




<div class="app">

<div class="container" id="app">


<!-- START SCREEN -->


<div class="logo">

GymPilot

</div>



<div class="title">

Your body.<br>

Your goals.<br>

Your system.

</div>



<div class="subtitle">

A premium fitness experience designed around you.

</div>




<button class="primary" onclick="startApp()">

Begin Journey →

</button>



</div>

</div>





<script>


let step=0;


let profile={

goals:[],
equipment:[]

};



const screens=[


{

title:"Welcome 👋",

text:"Let's create your personalised fitness blueprint.",

type:"welcome"

},


{

title:"What should we call you?",

type:"name"

},


{

title:"How old are you?",

type:"age"

},


{

title:"Your height?",

type:"height"

},


{

title:"Your current weight?",

type:"weight"

},


{

title:"What are your goals?",

type:"goals",

options:[

"💪 Build Muscle",

"🔥 Lose Fat",

"⚡ Become Stronger",

"🏃 Improve Fitness",

"🤸 Improve Mobility"

]

},


{

title:"Your fitness level?",

type:"level",

options:[

"🌱 Beginner",

"⚡ Intermediate",

🔥 Advanced",

"🏆 Athlete"

]

},


{

title:"Training style?",

type:"style",

options:[

"💪 Bodybuilding",

"🏋️ Strength",

"⚡ Athletic",

"⚖️ Balanced"

]

},


{

title:"Where do you train?",

type:"gym",

options:[

"🏢 Commercial Gym",

"🏠 Home Gym",

"💪 Minimal Equipment",

"🌱 No Equipment"

]

}


];



function startApp(){

step=0;

render();

}



function render(){

let app=document.getElementById("app");

let data=screens[step];


document.getElementById("progress").style.width=

((step)/(screens.length))*100+"%";



let html=`

<div class="title">

${data.title}

</div>

`;



if(data.text){

html+=`

<div class="subtitle">

${data.text}

</div>

`;

}



if(data.type==="name"||
data.type==="age"||
data.type==="height"||
data.type==="weight"){


html+=`

<div class="card">

<input class="input" id="answer">

<button class="primary" onclick="nextInput('${data.type}')">

Continue →

</button>

</div>

`;

}



if(data.type==="welcome"){


html+=`

<div class="card">

<div class="subtitle">

This takes around 2 minutes.

We'll build your personal fitness system.

</div>


<button class="primary" onclick="next()">

Continue →

</button>


</div>

`;

}



if(data.options){


data.options.forEach(x=>{


html+=`

<div class="option"

onclick="selectOption(this,'${data.type}','${x}')">

${x}

</div>

`;


});



html+=`

<button class="primary" onclick="next()">

Continue →

</button>

`;

}



app.innerHTML=html;


}


<script>


function next(){


if(step < screens.length-1){


step++;


render();


}


else{


finish();


}



}





function nextInput(type){


let value=document.getElementById("answer").value;



if(!value){

alert("Please enter your details");

return;

}



if(type==="name"){

profile.name=value;

}


if(type==="age"){

profile.age=value;

}


if(type==="height"){

profile.height=value;

}


if(type==="weight"){

profile.weight=value;

}



next();



}








function selectOption(element,type,value){



document
.querySelectorAll(".option")
.forEach(item=>{


item.classList.remove("active");


});



element.classList.add("active");



if(type==="goals"){


if(!profile.goals.includes(value)){


profile.goals.push(value);


}


}



else{


profile[type]=value;


}



}









function finish(){



localStorage.setItem(

"gympilot",

JSON.stringify(profile)

);



let app=document.getElementById("app");



document.getElementById("progress").style.width="100%";



app.innerHTML=`

<div class="logo">

GymPilot

</div>



<div class="title">

Your profile is ready 🎉

</div>


<div class="card">


<div class="subtitle">

Welcome ${profile.name || "there"}.

</div>



<br>



<p>

Goal:

<br>

<b>

${profile.goals.join(", ") || "Fitness"}

</b>

</p>



<p>

Level:

<br>

<b>

${profile.level || "Not selected"}

</b>

</p>



<p>

Training:

<br>

<b>

${profile.style || "Not selected"}

</b>

</p>



<button class="primary" onclick="goDashboard()">

Enter GymPilot →

</button>


</div>

`;



}







function goDashboard(){



window.location.href="dashboard.html";


}




render();



</script>


</body>

</html>
